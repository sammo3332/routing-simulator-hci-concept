name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Python-Abhängigkeiten installieren
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Backendtests ausführen
        run: python -m pytest -q

      - name: Node.js 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Frontend-Abhängigkeiten installieren
        run: npm ci

      - name: Frontendtests ausführen
        run: npm run test:frontend

      - name: JavaScript prüfen
        run: npm run lint

      - name: Produktions-Build erzeugen
        run: npm run build

      - name: Container-Image bauen
        run: docker build -t failover-routing-visualizer:ci .
